<!DOCTYPE html>
<html lang="en">

  <!-- HEAD -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>From A Storyteller</title>

    <!-- STYLES -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/content/content.css">

    <!-- GLOBAL SCRIPT -->
    <script type="module" src="/script.js"></script>
    <script type="module" src="/home.js"></script>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="/assets/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/brands.min.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/solid.min.css">
  </head>

  <!-- BODY -->
  <body class="home-page">

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- SIDEBAR + MAIN CONTENT -->
    <div class="site-layout">

      <!-- SIDEBAR -->
      <div id="sidebar-placeholder"></div>

      <!-- MAIN CONTENT AREA -->
      <main class="page-content">

        <section class="content-page">

          <!-- HERO -->
          <header class="content-page-hero">
            <h1>For the <em>Dreaming Hearts</em> and <em>Wandering Minds</em></h1>
            <p class="content-page-intro">
              Step into a growing world of original stories, creative games, visual storytelling, and imaginative resources created to spark curiosity, inspire creativity, and bring new ideas to life.
            </p>
          </header>

          <!-- FEATURED CONTENT -->
          <section class="content-featured" id="home-featured"></section>

          <!-- FILTERS -->
          <nav class="content-filter-row" id="home-filters" aria-label="Content Filters"></nav>

          <!-- CONTENT GRID -->
          <section class="content-grid" id="home-grid"></section>

        </section>

      </main>
    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

  </body>
