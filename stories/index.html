<!DOCTYPE html>
<html lang="en">

  <!-- HEAD -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PAGE TITLE -->
    <title>Stories | From A Storyteller</title>

    <!-- STYLES -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/content/content.css">

    <!-- GLOBAL SCRIPT -->
    <script type="module" src="/script.js"></script>
    <script type="module" src="/stories/stories.js"></script>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="/assets/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/brands.min.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/solid.min.css">
  </head>

  <!-- BODY -->
  <body>

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- SIDEBAR + MAIN CONTENT -->
    <div class="site-layout">

      <!-- SIDEBAR -->
      <div id="sidebar-placeholder"></div>

      <!-- MAIN CONTENT AREA -->
      <main class="page-content">

        <section class="content-page">

          <!-- HERO -->
          <header class="content-page-hero">
            <h1>Stories</h1>
            <p class="content-page-intro">
              Read original stories shaped by atmosphere, emotion, and imagination from From A Storyteller.
            </p>
          </header>

          <!-- FEATURED STORY -->
          <section class="content-featured" id="featured-story"></section>

          <!-- FILTERS -->
          <nav class="content-filter-row" id="stories-filters" aria-label="Story Filters"></nav>

          <!-- STORY GRID -->
          <section class="content-grid" id="stories-grid"></section>

        </section>

      </main>

    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

  </body>
</html>
