<!DOCTYPE html>
<html lang="en">

  <!-- HEAD -->
  <head>
    <!-- CORE META -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PAGE TITLE -->
    <title>Search | From A Storyteller</title>
    <meta
        name="description"
        content="Search stories, videos, games, and tools from From A Storyteller."
    >
    <link rel="canonical" href="https://fromastoryteller.com/search/">

    <!-- THEME -->
    <meta name="theme-color" content="#000000">

    <!-- STYLES -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/content/content.css">
    <link rel="stylesheet" href="/search/search.css">

    <!-- GLOBAL SCRIPT -->
    <script type="module" src="/script.js"></script>
    <script type="module" src="/search/search.js"></script>

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="/assets/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/brands.min.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/solid.min.css">
  </head>

  <!-- BODY -->
  <body>

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- SIDEBAR + MAIN CONTENT -->
    <div class="site-layout">

      <!-- SIDEBAR -->
      <div id="sidebar-placeholder"></div>

      <!-- MAIN CONTENT AREA -->
      <main class="page-content">

        <section class="search-page">

          <!-- HERO -->
          <header class="search-hero">
            <h1>Search</h1>
            <p class="search-intro">
              Explore stories, games, videos, and tools from across From A Storyteller.
            </p>
          </header>

          <section class="search-panel">
            <form class="search-page-form" role="search" autocomplete="off">
                <label class="search-page-label" for="search-page-input">Search the site</label>
                <div class="search-page-input-wrap">
                    <input
                        id="search-page-input"
                        class="search-page-input"
                        type="search"
                        name="q"
                        placeholder="Search stories, videos, games, and tools"
                        aria-label="Search the site"
                        autocomplete="off"
                    >
                    <button type="submit" class="search-page-button" aria-label="Search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
            </form>

            <div class="search-summary" id="search-summary">
                Start typing to search the site.
            </div>
          </section>

          <section class="search-results-section">
            <div class="content-grid search-results-grid" id="search-results-grid"></div>
          </section>

        </section>

      </main>
    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

  </body>
</html>
