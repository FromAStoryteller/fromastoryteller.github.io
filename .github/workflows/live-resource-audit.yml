name: Read-only live resource audit
on:
  pull_request:
    paths:
      - .github/workflows/live-resource-audit.yml
      - scripts/audit-live-resources.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/audit-live-resources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-resource-audit
          path: loading-audit.json
          retention-days: 7
