name: Verify live Studio recovery release
on:
  push:
    branches: [verify/live-studio-automatic-recovery]
permissions:
  contents: read
jobs:
  live-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-live-studio-recovery.mjs
