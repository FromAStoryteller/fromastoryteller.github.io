name: Image access migration name
on:
  push:
    branches: [verify/image-access-migration]
permissions:
  contents: read
jobs:
  name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes supabase@2.120.0 migration new image_service_access
