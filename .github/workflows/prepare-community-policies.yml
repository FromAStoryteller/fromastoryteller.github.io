name: Prepare community policy candidate
on:
  push:
    branches: [feat/account-contributor-policies]
    paths: [supabase/policy-preparation.sql]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate migration filename with pinned Supabase CLI
        run: |
          npx --yes supabase@2.120.0 migration new --help
          npx --yes supabase@2.120.0 migration new community_policies
          target=$(find supabase/migrations -name '*_community_policies.sql')
          cat supabase/policy-preparation.sql > "$target"
          rm supabase/policy-preparation.sql
      - run: npm run validate
      - run: node scripts/prepare-fas-community-policies.mjs
      - name: Commit generated candidate and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml content account/policy-versions.json supabase/migrations supabase/ops supabase/policy-preparation.sql
          git commit -m "Freeze community policy candidate and generate migration"
          git push
      - run: npm test
      - run: npm run validate:references
      - run: npm run build:cloudflare
