name: Update site indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site-indexes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate content index and sitemap
        run: node scripts/generate-site-indexes.mjs

      - name: Commit generated files when needed
        shell: bash
        run: |
          if git diff --quiet -- content/content-index.json sitemap.xml; then
            echo "Generated files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/content-index.json sitemap.xml
          git commit -m "chore: update generated site indexes"
          git push
