name: Validate site indexes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate site indexes
        run: node scripts/generate-site-indexes.mjs

      - name: Check generated files are up to date
        shell: bash
        run: |
          if ! git diff --quiet -- content/content-index.json sitemap.xml '*.html'; then
            echo "Generated site indexes are out of date."
            echo "Commit the regenerated files before pushing."
            git diff -- content/content-index.json sitemap.xml '*.html'
            exit 1
          fi

          echo "Generated site indexes are up to date."