name: Verify publishing interface
on:
  push:
    branches: [verify/publishing-interface]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-publishing-interface.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publishing-interface
          path: .preview-cache/publishing-interface/
