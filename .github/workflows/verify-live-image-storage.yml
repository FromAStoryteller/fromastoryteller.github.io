name: Verify live image storage
on:
  push:
    branches: [verify/live-image-storage]
permissions:
  contents: read
jobs:
  live-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-live-image-storage.mjs
