name: Verify story lifecycle
on:
  push:
    branches: [verify/story-publishing-lifecycle]
permissions:
  contents: read
jobs:
  lifecycle-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-story-lifecycle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-lifecycle-browser
          path: .preview-cache/
