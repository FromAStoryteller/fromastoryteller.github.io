name: Shared content layout browser checks
on:
  pull_request:
    paths:
      - systems/content/**
      - systems/community/interactive-*.mjs
      - systems/community/legacy-*.mjs
      - systems/community/studio-editor.mjs
      - systems/community/content-history.mjs
      - systems/community/publish-review.mjs
      - scripts/test-publish-review-browser.mjs
      - systems/community/profile-*.mjs
      - scripts/test-profile-history-browser.mjs
      - scripts/test-stable-viewport-browser.mjs
      - account/**
      - css/**
      - tools/**
      - systems/core/**
      - systems/privacy/**
      - systems/community/audience-report.mjs
      - scripts/test-contributor-insights-browser.mjs
      - components/**
      - scripts/test-header-portrait-browser.mjs
      - scripts/test-player-account-polish-browser.mjs
      - scripts/test-content-details-browser.mjs
      - scripts/test-published-editorial-browser.mjs
      - scripts/test-content-discovery-browser.mjs
      - scripts/test-legacy-projects-browser.mjs
      - scripts/test-existing-file-editor-browser.mjs
      - systems/content/page-layout.mjs
      - scripts/test-content-layout-browser.mjs
      - .github/workflows/content-layout-browser.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node scripts/verify-content-layouts.mjs
        env:
          FAS_LAYOUT_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm install --no-save playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: npx vite --host 127.0.0.1 --port 55410 > /tmp/fas-layout-vite.log 2>&1 &
      - run: node scripts/wait-for-preview.mjs
      - run: node scripts/test-content-layout-browser.mjs
      - run: node scripts/test-content-details-browser.mjs
      - run: node scripts/test-published-editorial-browser.mjs
      - run: node scripts/test-content-discovery-browser.mjs
      - run: node scripts/test-legacy-projects-browser.mjs
      - run: node scripts/test-existing-file-editor-browser.mjs
      - run: node scripts/test-community-usability-browser.mjs
      - run: node scripts/test-studio-library-browser.mjs
      - run: node scripts/test-player-account-polish-browser.mjs
      - run: node scripts/test-header-portrait-browser.mjs
      - run: node scripts/test-profile-history-browser.mjs
      - run: node scripts/test-contributor-insights-browser.mjs
      - run: node scripts/test-publish-review-browser.mjs
      - run: node scripts/test-stable-viewport-browser.mjs
