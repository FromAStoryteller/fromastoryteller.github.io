name: Generate shared content layouts
on:
  pull_request:
    paths:
      - scripts/generate-content-layouts.mjs
      - scripts/build-games.mjs
      - .github/workflows/content-layouts-generate.yml
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/shared-content-layouts'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Commit generated pages and independent game bundles
        run: |
          git add -- '*.html' content sitemap.xml cloudflare-worker.mjs games/rally-clash/game.js games/brick-blitz/game.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate shared content pages and independent game bundles"
          git push origin HEAD:feat/shared-content-layouts
