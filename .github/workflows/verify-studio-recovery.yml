name: Verify Studio recovery
on:
  push:
    branches: [verify/studio-automatic-recovery]
permissions:
  contents: read
jobs:
  recovery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-studio-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-recovery-browser
          path: .preview-cache/studio-recovery/
