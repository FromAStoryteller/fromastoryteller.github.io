name: Verify published discovery release
on:
  push:
    branches: [main]
    paths:
      - systems/content/**
      - account/policy-versions.json
      - scripts/verify-discovery-release.mjs
      - .github/workflows/verify-discovery-release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-discovery-release.mjs
