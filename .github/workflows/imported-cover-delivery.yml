name: Imported cover delivery
on:
  pull_request:
    paths:
      - systems/community/public-story-catalog.mjs
      - systems/content/imported-cover-images.mjs
      - scripts/test-imported-cover-browser.mjs
      - scripts/verify-cover-delivery.mjs
      - .github/workflows/imported-cover-delivery.yml
  push:
    branches: [main]
    paths: [systems/community/public-story-catalog.mjs, systems/content/imported-cover-images.mjs]
permissions:
  contents: read
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build:cloudflare
      - run: node scripts/test-imported-cover-browser.mjs
        if: github.event_name == 'pull_request'
      - run: node scripts/verify-cover-delivery.mjs
        if: github.event_name == 'push'
