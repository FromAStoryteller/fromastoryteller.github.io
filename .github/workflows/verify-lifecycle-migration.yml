name: Prepare story lifecycle migration
on:
  push:
    branches: [verify/studio-lifecycle-migration]
permissions:
  contents: read
jobs:
  migration-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes supabase@2.120.0 migration new --help
      - run: npx --yes supabase@2.120.0 migration new story_publishing_lifecycle
      - run: git ls-files --others --exclude-standard supabase/migrations
      - name: Check current Supabase changelog
        run: |
          node --input-type=module -e "const r=await fetch('https://supabase.com/changelog.md');if(!r.ok)throw Error('Changelog unavailable');const t=await r.text();console.log(t.slice(0,16000));"
