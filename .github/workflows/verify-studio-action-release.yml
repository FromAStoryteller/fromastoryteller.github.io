name: Verify live Studio draft actions
on:
  push:
    branches: [verify/studio-action-release]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public assets without accessing accounts
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const base='https://fromastoryteller.com';
          const normalize=s=>s.replace(/\r\n/g,'\n').trimEnd();
          for(const path of ['css/studio.css','systems/community/studio-editor.mjs']){
            const expected=normalize(await readFile(path,'utf8'));let matched=false;
            for(let attempt=0;attempt<12;attempt++){
              const r=await fetch(base+'/'+path,{redirect:'manual',cache:'no-store'});
              if(r.ok&&normalize(await r.text())===expected){matched=true;break;}
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            assert.ok(matched,'Production source mismatch: '+path);console.log('PASS live '+path);
          }
          const page=await fetch(base+'/account/studio/',{redirect:'manual',cache:'no-store'});assert.equal(page.status,200);assert.match(await page.text(),/data-studio-root/);
          console.log('PASS public Studio shell; no authenticated requests or content mutations');
          NODE
