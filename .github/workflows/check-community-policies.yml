name: Check community policy onboarding
on:
  push:
    branches: [feat/account-contributor-policies]
    paths:
      - scripts/test-fas-community-policies-browser.mjs
      - systems/community/studio-page.mjs
      - systems/community/invitation-page.mjs
      - account/agreements.js
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.0
      - run: npx playwright install --with-deps chromium
      - run: npx vite --host 127.0.0.1 --port 55410 > /tmp/fas-policy-vite.log 2>&1 &
      - run: node scripts/test-fas-community-policies-browser.mjs
