name: Verify public community policies
on:
  push:
    branches: [verify/community-policy-release]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public bytes, links and current account policy configuration
        env:
          FAS_EXPECTED_POLICY: community-policies-2026-10-18-v1
          FAS_EXPECTED_RUNTIME: community-policies-2026-10-18-v1
        run: node scripts/verify-fas-community-policies-public.mjs
