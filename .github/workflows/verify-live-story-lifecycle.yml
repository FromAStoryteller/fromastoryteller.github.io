name: Verify live story lifecycle
on:
  push:
    branches: [verify/live-story-lifecycle]
permissions:
  contents: read
jobs:
  live-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-live-story-lifecycle.mjs
