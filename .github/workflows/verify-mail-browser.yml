name: Verify transactional email browser
on:
  push:
    branches: [verify/transactional-email-browser]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright@1.58.0 vite@6.4.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npx vite --host 127.0.0.1 --port 55410 > /tmp/fas-mail-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:55410/tests/admin-preview/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-mail-browser.mjs
      - name: Check pinned CLI secret installation interface
        run: npx --yes supabase@2.120.0 secrets set --help
