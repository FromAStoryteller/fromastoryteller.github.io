<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="header-inner">
    <button class="menu-toggle shell-control" type="button" aria-label="Open menu" aria-controls="site-sidebar" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
    <div class="header-brand"><a href="/" class="logo"><span class="visually-hidden">From A Storyteller</span><span class="wordmark__from" aria-hidden="true">from,</span><span class="wordmark__name" aria-hidden="true">A Storyteller</span></a></div>
    <!-- Insert the approved quill as an img with alt="" here. The slot is non-interactive. -->
    <span class="header-quill" data-quill-slot="header" aria-hidden="true"></span>
    <div class="header-right">
      <button class="search-toggle shell-control" type="button" aria-label="Open search" aria-controls="header-search-panel" aria-expanded="false"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
      <button class="theme-toggle shell-control" type="button" data-theme-toggle aria-label="Theme: Auto. Switch to light mode"><svg class="theme-toggle__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg><span class="visually-hidden" data-theme-label>Auto</span></button>
    </div>
    <div class="header-search-panel" id="header-search-panel" hidden>
      <form class="site-search" action="/search/" role="search" autocomplete="off">
        <div class="site-search-wrap">
          <input type="search" name="q" placeholder="Search the World…" aria-label="Search blogs, games, stories, tools, and videos" autocomplete="off" class="site-search-input">
          <button type="submit" class="search-btn shell-control" aria-label="Search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
          <div class="site-search-suggestions" aria-label="Search suggestions"></div>
        </div>
      </form>
      <button class="search-close shell-control" type="button" aria-label="Close search"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
  </div>
</header>
<div class="header-body-fade" aria-hidden="true"></div>
