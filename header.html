<!DOCTYPE html>

<html lang="en">

  <!-- HEAD -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css">

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&display=swap" rel="stylesheet">

    <!-- FONT AWESOME - SOCIAL MEDIA ICONS -->
    <link rel="stylesheet" href="assets/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/brands.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/solid.min.css">
  </head>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <!-- LEFT: Toggle + Logo -->
      <div class="brand">
        <button class="menu-toggle" aria-label="Open Menu"><i class="fa-solid fa-bars"></i></button>
        <a href="/index.html" class="logo">From A Storyteller</a>
      </div>
    
      <!-- MIDDLE: Search -->
      <form class="site-search" action="/search.html" role="search">
        <input type="search" name="q" placeholder="Search" aria-label="Search">
      </form>

      <!-- RIGHT: Socials -->
      <nav class="socials" aria-label="Social Links">
        <a href="https://www.facebook.com/fromastoryteller/" aria-label="Facebook" target="_blank" rel="noopener"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.instagram.com/fromastoryteller/" aria-label="Instagram" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.youtube.com/@fromastoryteller/" aria-label="YouTube" target="_blank" rel="noopener"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://www.tiktok.com/@fromastoryteller/" aria-label="TikTok" target="_blank" rel="noopener"><i class="fa-brands fa-tiktok"></i></a>
      </nav>
    </div>
  </header>

</html>
