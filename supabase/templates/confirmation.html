<!doctype html>
<html lang="en" dir="ltr">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify your From A Storyteller email</title></head>
  <body style="margin:0;background:#f4efdf;color:#182b43;font-family:Arial,sans-serif;">
    <div lang="en" dir="ltr" style="max-width:480px;margin:0 auto;padding:32px 24px;">
      <p style="font-size:14px;">From A Storyteller · Local test email</p>
      <h1 style="font-size:26px;line-height:1.3;">Verify your email address</h1>
      <p style="font-size:16px;line-height:1.6;">Confirm your email to finish setting up your reader account.</p>
      <p style="font-size:16px;line-height:1.6;">This local test link expires in one hour and can be used once.</p>
      <p style="margin:28px 0;"><a href="{{ .SiteURL }}/account/verify-email/?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:16px 24px;background:#182b43;color:#ffffff;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;">Verify email address</a></p>
      <p style="font-size:16px;line-height:1.6;">If you didn’t request this account, you can ignore this email.</p>
    </div>
  </body>
</html>
