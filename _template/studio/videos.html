<article class="story-page">
  <header class="story-header">
    <div class="story-hero image-overlay">
      <figure class="story-feature-image image-overlay__media"><img data-studio-feature alt=""></figure>
      <div class="story-hero-copy image-overlay__content">
        <p class="story-category">Video</p>
        <h1 data-studio-title></h1>
      </div>
    </div>
    <p class="story-meta"><span data-studio-author></span> · <time data-studio-date></time></p>
  </header>
  <section class="story-content" data-studio-body></section><div data-studio-video></div>
</article>
